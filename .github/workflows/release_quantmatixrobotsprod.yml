# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - QuantmatixRobotsProd

on:
  push:
    branches:
      - 'release'
  workflow_dispatch:

#Never run two production deployments at the same time
concurrency:
  group: deploy-quantmatixrobotsprod
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout QuantmatixRobots
        uses: actions/checkout@v4
        with:
          path: QuantmatixRobots

      - name: Checkout QuantmatixShared
        uses: actions/checkout@v4
        with:
          repository: Quantmatix/QuantmatixShared
          token: ${{ secrets.QUANTMATIX_SHARED_TOKEN }}
          path: QuantmatixShared

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build QuantmatixShared
        working-directory: QuantmatixShared
        run: dotnet build --configuration Release

      - name: Build QuantmatixRobots
        working-directory: QuantmatixRobots
        run: dotnet build --configuration Release

      - name: dotnet publish
        working-directory: QuantmatixRobots
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_PROD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PROD_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PROD_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'QuantmatixRobotsProd'
          slot-name: 'Production'
          package: .
