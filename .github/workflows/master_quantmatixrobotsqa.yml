name: QuantmatixRobotsQA CD to Azure

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository 1 (QuantmatixRobots) into a folder named "QuantmatixRobots"
      - name: Checkout QuantmatixRobots repository
        uses: actions/checkout@v2
        with:
          path: QuantmatixRobots

      # 2. Checkout repository 2 (QuantmatixShared) into a folder named "QuantmatixShared"
      - name: Checkout QuantmatixShared repository
        uses: actions/checkout@v2
        with:
          repository: Quantmatix/QuantmatixShared
          token: ${{ secrets.QUANTMATIX_APP_DEPLOYMENT }}
          path: QuantmatixShared

      # 3. List repository contents to verify the folder structure
      - name: List repository contents
        run: ls -R $GITHUB_WORKSPACE

      # 4. Setup .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.0.x'

      # 5. Clean the workspace and build artifacts
      - name: Clear NuGet caches
        run: dotnet nuget locals all --clear

      # 6. Restore dependencies for the main project
      - name: Restore QuantmatixRobots dependencies
        run: dotnet restore QuantmatixRobots/QuantmatixRobots.csproj

      # 7. Build the shared project (repository 2)
      - name: Build QuantmatixShared
        run: dotnet build QuantmatixShared/QuantmatixShared.csproj --no-restore --configuration QA

      # 8. Build the main project (repository 1)
      - name: Build QuantmatixRobots
        run: dotnet build QuantmatixRobots/QuantmatixRobots.csproj --no-restore --configuration QA

      # 9. Publish the main project
      - name: Publish QuantmatixRobots
        run: dotnet publish QuantmatixRobots/QuantmatixRobots.csproj --no-restore --configuration QA -o ./publish

      # 10. Deploy to Azure: QA Test App 
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'QuantmatixRobotsQA'
          publish-profile: ${{ secrets.AZURE_QUANTMATIXROBOTSQA_PUBLISH_PROFILE }}
          package: ./publish